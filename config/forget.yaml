# -----------------------------
# Model
# -----------------------------
model_family: llama3-8b-instruct # Qwen2.5-7B-Instruct
base_model_path: meta-llama/Meta-Llama-3-8B-Instruct
# (You can need to switch the finetuned model.)
model_path: ${base_model_path}
# -----------------------------
# Data
# -----------------------------
data_name: pistol_sample1
forget_edge: ['A_B'] # this should be a list # ['A_B'] ['author_1']
use_different_retain_dataset: false # if true, the retain dataset will be different from the forget dataset, otherwise it will be the same as the forget dataset
different_retain_set_path: dataset/unlearning/factual_data.json # retain set for TRAINING (activation preservation)
retain_eval_data_path: null # retain set for EVAL (held-out collateral, has answers); WMDP: dataset/unlearning/mmlu_college_biology.json

# -----------------------------
# Unlearning knobs
# -----------------------------
layer_modified: [22] # hardcoded target layer, used only if layer_sweep: false
coeff_list: [+2.0] # need to be list
use_harmful: true
use_unverified: false

# Layer selection (LUNAR Procedure 2, §3.2) — same as the MoE runner.
#   layer_sweep: true  -> pick the layer by the (s1 - s2) sweep (overrides layer_modified)
#   layer_sweep: false -> use the hardcoded layer_modified above (repo's original behavior)
layer_sweep: false
sweep_stride: 4                 # coarse grid: probe every Nth layer (ignored if sweep_layers set)
sweep_layers: null              # or an explicit list, e.g. [8, 12, 16, 20, 24]
sweep_n_forget: 64              # forget-subset size for sweep generation (cost is per candidate layer)
sweep_n_undesired: 64           # #unverified prompts for the s2 reference (generated once, no hook)
embed_model_name: sentence-transformers/all-MiniLM-L6-v2
desired_responses_path: dataset/unlearning/harmful_refusal_response.txt   # s1 target (harm refusals)
undesired_prompts_path: dataset/splits/unverified.json                    # s2 target (base answers to these)
num_epochs: 20
lr: 0.01
positions: -1
n_train: 128
n_test: 100
n_val: 32
max_new_tokens: 64

# -----------------------------
# Evaluation
# -----------------------------
eval_batch_size: 16
eval_generation_max_length: 512
eval_generation_max_new_tokens: 512
if_eval_factual: true
factual_data_path: dataset/unlearning/factual_data.json
compute_es_score: false

# -----------------------------
# Save logging
# -----------------------------
save_unlearned_model: false
save_unlearned_model_path: models_lunar/${data_name}/${model_family}/${forget_edge}
save_folder: luanr
save_path: run_results/completions/${model_family}/${save_folder}/${data_name}
