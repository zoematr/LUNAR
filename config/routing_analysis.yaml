# Routing frequency analysis
#
# ── Pick a model (uncomment one block) ──────────────────────────────

# OLMoE-1B-7B — fits on free Colab T4 / CPU
model_family: olmoe-1b-7b-instruct
base_model_path: allenai/OLMoE-1B-7B-0924-Instruct

# Qwen1.5-MoE-A2.7B — 24 layers, same architecture as Qwen2-57B (~29GB bfloat16, needs 1× L40S/A40)
# model_family: Qwen1.5-MoE-A2.7B-Chat
# base_model_path: Qwen/Qwen1.5-MoE-A2.7B-Chat

# Qwen2-57B-A14B — full model, cluster only (~115GB bfloat16, needs ~8×GPU)
# model_family: Qwen2-57B-A14B-Instruct
# base_model_path: Qwen/Qwen2-57B-A14B-Instruct

# Qwen3-30B-A3B — 48 layers, 128 experts, ~61GB bfloat16
# model_family: Qwen3-30B-A3B
# base_model_path: Qwen/Qwen3-30B-A3B

# Llama 4 Scout — 48 layers, 16 experts, ~217GB bfloat16
# model_family: llama4-scout
# base_model_path: meta-llama/Llama-4-Scout-17B-16E-Instruct

# Mistral Small 4 — 36 layers, 128 experts, ~238GB bfloat16
# model_family: mistral-small-4
# base_model_path: mistralai/Mistral-Small-4-119B-2603

# ────────────────────────────────────────────────────────────────────
model_path: ${base_model_path}

# Data
data_name: pistol_sample1
forget_edge: ['A_B']
use_different_retain_dataset: false
different_retain_set_path: dataset/unlearning/factual_data.json

# Device: "cpu", "cuda", "cuda:0", or "auto" (auto-detects GPU)
device: auto

# Analysis knobs
max_samples: null  # null = use all; set e.g. 128 to cap both sets

# Output
save_path: run_results/routing/${model_family}/${data_name}
