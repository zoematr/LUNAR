# ── Pick a model (uncomment one block) ──────────────────────────────

# OLMoE-1B-7B — 16 layers, fits on free Colab T4 (~14GB)
model_family: olmoe-1b-7b-instruct
base_model_path: allenai/OLMoE-1B-7B-0924-Instruct
layer_modified: [10]     # following CASAL findings
eval_batch_size: 16

# Qwen1.5-MoE-A2.7B — 24 layers, 1× L40S/A40 (~29GB)
# model_family: Qwen1.5-MoE-A2.7B-Chat
# base_model_path: Qwen/Qwen1.5-MoE-A2.7B-Chat
# layer_modified: [12]   # mid-point of 24 layers
# eval_batch_size: 8

# Qwen2-57B-A14B — 28 layers, 4× L40S/A40 (~115GB)
# model_family: Qwen2-57B-A14B-Instruct
# base_model_path: Qwen/Qwen2-57B-A14B-Instruct
# layer_modified: [14]   # mid-point of 28 layers
# eval_batch_size: 4

# ────────────────────────────────────────────────────────────────────
model_path: ${base_model_path}

# -----------------------------
# Data
# -----------------------------
data_name: pistol_sample1
forget_edge: ['A_B']
use_different_retain_dataset: false
different_retain_set_path: dataset/unlearning/factual_data.json   # retain set for TRAINING (activation preservation)
retain_eval_data_path: null   # retain set for EVAL (held-out benign-bio collateral, has answers); WMDP: dataset/unlearning/mmlu_college_biology.json

# -----------------------------
# Unlearning knobs
# -----------------------------
coeff_list: [+2.0]
use_harmful: true
use_unverified: false
num_epochs: 20
lr: 0.01
positions: -1
n_train: 128
n_test: 100
n_val: 32
max_new_tokens: 64

# -----------------------------
# Layer selection (LUNAR Procedure 2, §3.2)
#   layer_sweep: true  -> pick the layer by the (s1 - s2) sweep (overrides layer_modified)
#   layer_sweep: false -> use the hardcoded layer_modified above (original behavior)
# -----------------------------
layer_sweep: false
sweep_stride: 4                 # coarse grid: probe every Nth layer (ignored if sweep_layers set)
sweep_layers: null              # or an explicit list, e.g. [8, 12, 16, 20, 24, 28]
sweep_n_forget: 64              # forget-subset size for sweep generation (cost is per candidate layer)
sweep_n_undesired: 64           # #unverified prompts for the s2 reference (generated once, no hook)
embed_model_name: sentence-transformers/all-MiniLM-L6-v2
desired_responses_path: dataset/unlearning/harmful_refusal_response.txt   # s1 target: harmfulness-based refusals (reject because harmful, not privacy/inability)
undesired_prompts_path: dataset/splits/unverified.json            # s2 target: base model's answers to these = undesired "still answering" style

# -----------------------------
# Evaluation
# -----------------------------
eval_generation_max_length: 512
eval_generation_max_new_tokens: 512
if_eval_factual: true   #evaluate also on factual knowledge to make unlearning doesn't damage general factual knowledge
factual_data_path: dataset/unlearning/factual_data.json
compute_es_score: false

# -----------------------------
# Save logging
# -----------------------------
save_unlearned_model: false
save_unlearned_model_path: models_lunar/${data_name}/${model_family}/${forget_edge}
save_folder: lunar_moe
save_path: run_results/completions/${model_family}/${save_folder}/${data_name}
